<svg width="200" height="200" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <!-- Face -->
  <circle cx="100" cy="110" r="60" fill="#f4a261"/>

  <!-- Ears -->
  <polygon points="50,60 70,20 90,60" fill="#f4a261"/>
  <polygon points="110,60 130,20 150,60" fill="#f4a261"/>
  <polygon points="60,60 70,35 80,60" fill="#e76f51"/>
  <polygon points="120,60 130,35 140,60" fill="#e76f51"/>

  <!-- Eyes -->
  <ellipse cx="75" cy="110" rx="10" ry="14" fill="white"/>
  <ellipse cx="125" cy="110" rx="10" ry="14" fill="white"/>
  <ellipse cx="75" cy="110" rx="4" ry="8" fill="black"/>
  <ellipse cx="125" cy="110" rx="4" ry="8" fill="black"/>

  <!-- Nose -->
  <polygon points="95,125 105,125 100,135" fill="pink"/>

  <!-- Mouth -->
  <path d="M100 135 Q90 145 80 140" stroke="black" stroke-width="2" fill="none"/>
  <path d="M100 135 Q110 145 120 140" stroke="black" stroke-width="2" fill="none"/>

  <!-- Whiskers -->
  <line x1="40" y1="130" x2="80" y2="130" stroke="black" stroke-width="2"/>
  <line x1="40" y1="140" x2="80" y2="140" stroke="black" stroke-width="2"/>
  <line x1="120" y1="130" x2="160" y2="130" stroke="black" stroke-width="2"/>
  <line x1="120" y1="140" x2="160" y2="140" stroke="black" stroke-width="2"/>
</svg>